name: Boekingstest (tijdelijk)
on:
  push:
    branches: [claude/boekingstest]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Live site controleren
        run: |
          exec > uitslag.txt 2>&1
          S=https://boshuispleuntje.nl
          for p in / /en/ /de/ /boeking/ /api-data/tarieven.json; do echo "GET $p -> $(curl -s -o /dev/null -w '%{http_code}' $S$p)"; done
          echo "--- betaalstap starten (doordeweeks feb 2027, niet betalen; vervalt na 20 min)"
          r=$(curl -s -X POST -H 'X-Pleuntje: 1' -H 'Content-Type: application/json' -d '{"naam":"Test Claude (niet betalen)","email":"test@example.com","aankomst":"2027-02-16","vertrek":"2027-02-18","personen":2,"honden":0,"akkoord":true,"taal":"nl"}' $S/api/boek.php)
          echo "$r"
          link=$(echo "$r" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("betaallink",""))')
          echo "betaallink: $link"
          [ -n "$link" ] && echo "Mollie-pagina -> $(curl -s -L -o m.html -w '%{http_code} %{url_effective}' "$link")" && grep -o '<title>[^<]*' m.html; grep -o -i '€ *[0-9.,]*' m.html | head -3
      - name: Uitslag bewaren
        if: always()
        run: |
          mkdir u && cp uitslag.txt u/ && cd u && git init -q -b boekingstest-uitslag && git config user.name gh && git config user.email gh@users.noreply.github.com && git add . && git commit -qm uitslag && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" boekingstest-uitslag
