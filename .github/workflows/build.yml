name: Bouw site
on:
  push:
    branches: [claude/pleun-vacation-rental-site-69bw2g]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: pleuntje-site
          path: out/
      - name: Zet zip-bestand op de branch website-zip
        run: |
          cd out && zip -qr ../pleuntje-site.zip . && cd ..
          mkdir zipdir && mv pleuntje-site.zip zipdir/
          cd zipdir
          git init -q -b website-zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pleuntje-site.zip
          git commit -qm "Site-zip van ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" website-zip
