name: "Tijdelijk onderzoek: witte pagina (27 nov)"
on:
  push:
    branches: [claude/check-certificaat]
permissions:
  contents: read
jobs:
  kijken:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Voorkant en onderdelen ophalen
        run: |
          set +e
          for u in https://boshuispleuntje.nl/ https://www.boshuispleuntje.nl/ https://boshuispleuntje.nl/de/ https://boshuispleuntje.nl/beheer/ https://boshuispleuntje.nl/api/beschikbaarheid.php; do
            curl -sS -o /tmp/p -w "$u -> %{http_code} %{size_download} bytes ssl=%{ssl_verify_result}\n" --max-time 30 "$u"
          done
          curl -sS --max-time 30 https://boshuispleuntje.nl/ -o home.html -D headers.txt
          echo "== headers"; cat headers.txt
          echo "== begin html"; head -c 3000 home.html; echo
          echo "== eind html"; tail -c 1500 home.html; echo
          echo "== onderdelen"
          grep -oE '/_next/static/[^"'"'"' )\\]+' home.html | sort -u | head -60 > assets.txt
          wc -l assets.txt
          while read a; do curl -sS -o /dev/null -w "%{http_code} %{size_download} %{content_type} $a\n" --max-time 30 "https://boshuispleuntje.nl$a"; done < assets.txt
          echo "== htaccess-achtige test"; curl -sSI --max-time 20 https://boshuispleuntje.nl/index.html | head -15
