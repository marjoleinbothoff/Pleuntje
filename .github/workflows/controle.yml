name: Controleer wijzigingen (zonder publiceren)
# Bouwt de site op een andere tak dan de live-tak, om fouten te vinden
# voordat iets op boshuispleuntje.nl komt. Zet niets online.
on:
  push:
    branches-ignore:
      - claude/pleun-vacation-rental-site-69bw2g
      - website-zip
permissions:
  contents: read
jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Controleer PHP-bestanden
        run: for f in $(find out/api -name '*.php'); do php -l "$f"; done
      - name: Controleer dat de server-bestanden in de site zitten
        run: |
          test -f out/api/beheer.php
          test -f out/api/beschikbaarheid.php
          test -f out/api/agenda.php
          test -f out/api/lib/.htaccess
          test -f out/api/lib/kern.php
          test -f out/beheer/index.html
          echo "Alles aanwezig"
      - name: Lint
        run: |
          npx eslint . -f json -o lint.json || true
          node -e '
            const r = require("./lint.json"); let n = 0;
            for (const f of r) for (const m of f.messages) {
              n++;
              const file = f.filePath.replace(process.cwd() + "/", "");
              console.log(`::${m.severity === 2 ? "error" : "warning"} file=${file},line=${m.line}::${m.ruleId}: ${m.message}`);
            }
            if (r.some(f => f.errorCount > 0)) process.exit(1);
          '
