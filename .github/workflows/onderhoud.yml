name: Onderhoud boshuispleuntje.nl (elk uur)
# Port elk uur de server van boshuispleuntje.nl aan, zodat betalingen worden nagelopen
# en geplande mails op tijd vertrekken, ook als er even niemand de site bezoekt.
# (De server doet alleen wat op dat moment nodig is; vaker aanroepen kan geen kwaad.)
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  onderhoud:
    runs-on: ubuntu-latest
    steps:
      - name: Server aanporren
        run: curl -fsS --max-time 60 https://boshuispleuntje.nl/api/onderhoud.php
